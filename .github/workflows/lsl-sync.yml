name: Validate local LSL datasets
on:
  workflow_dispatch:
  pull_request:
    paths: ['data/**', 'scripts/**', 'src/data/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts/lib -p 'test_*.py'
      - run: python scripts/import-datasets.py
      - name: Check generated data is current
        run: git diff --exit-code -- src/data/catalog.json public/wiki-source data/reports

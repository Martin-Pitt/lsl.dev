name: Validate local LSL datasets
on:
  workflow_dispatch:
  pull_request:
    paths: ['data/**', 'scripts/**', 'src/data/**', 'src/content/docs/functions/**', 'src/content/docs/events/**', 'src/content/docs/constants/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts/lib -p 'test_*.py'
      - run: python scripts/import-datasets.py
      - name: Check generated data is current
        run: git diff --exit-code -- src/data/catalog.json src/data/wiki-html data/derived data/reports/import-report.json
      # The MDX pages are hand-edited and not regenerated here. Fail only when an API has no page
      # or a page has no public API; signature drift is reported for review, not failed on.
      - name: Check every public API has exactly one page
        run: python scripts/generate-mdx.py --check

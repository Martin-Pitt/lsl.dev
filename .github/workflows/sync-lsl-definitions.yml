name: Sync LSL Definitions

# Refreshes data/sources/lsl_definitions.yaml (and definitions-history.json, from the
# repo's git history) from secondlife/lsl-definitions and regenerates the catalog. Only the definitions repo is fetched; the wiki snapshot
# (data/sources/wiki-English.xml) is never refreshed automatically, because the
# Second Life Wiki blocks automated requests.

on:
  workflow_dispatch:

  # Run daily at 2 AM UTC to catch updates
  #schedule:
  #  - cron: '0 2 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install importer requirements
      run: pip install -r scripts/requirements.txt

    # Full history: scripts/definitions-history.py derives per-API added/updated dates from it.
    - name: Checkout LSL definitions
      uses: actions/checkout@v6
      with:
        repository: secondlife/lsl-definitions
        path: .lsl-definitions
        fetch-depth: 0

    - name: Copy LSL definitions
      run: |
        cp .lsl-definitions/lsl_definitions.yaml data/sources/lsl_definitions.yaml
        cp .lsl-definitions/LICENSE data/sources/definitions-LICENSE
        echo "LSL definitions file size: $(wc -c < data/sources/lsl_definitions.yaml) bytes"

    - name: Derive added/updated dates from definitions history
      run: python scripts/definitions-history.py --repo .lsl-definitions

    - name: Regenerate catalog
      run: python scripts/import-datasets.py

    # API pages (src/content/docs/{functions,events,constants}/*.mdx) belong to people: the
    # generator only creates pages for new APIs and reports drift; it never rewrites a page.
    # Signatures, parameters and other facts render from the catalog, so they update anyway.
    - name: Create pages for new APIs and report drift
      id: mdx
      run: |
        python scripts/generate-mdx.py | tee mdx-report.txt
        {
          echo 'report<<EOF'
          cat mdx-report.txt
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
        rm mdx-report.txt

    - name: Run data tests
      run: python -m unittest discover -s scripts/lib -p 'test_*.py'

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: Update LSL definitions and regenerate catalog
        title: 'Auto-update: LSL definitions and generated catalog'
        body: |
          This PR was automatically created by the LSL definitions sync workflow.

          Changes:
          - Updated `data/sources/lsl_definitions.yaml` from secondlife/lsl-definitions
          - Regenerated `data/sources/definitions-history.json` (added/updated dates) from its git history
          - Regenerated `src/data/catalog.json`, `src/data/wiki-html`, `data/derived` (including the raw wikitext in `data/derived/wiki-source`) and `data/reports`
          - Created MDX pages for new APIs only; existing pages are never rewritten

          MDX generator report (orphaned pages and drift need a person; see docs/editing-api-pages.md):

          ```
          ${{ steps.mdx.outputs.report }}
          ```

          The wiki snapshot is unchanged. Please review the changes before merging.
        branch: auto-update-lsl-definitions
        add-paths: |
          data/sources
          data/sources/definitions-history.json
          src/data
          src/content/docs/functions
          src/content/docs/events
          src/content/docs/constants
          data/derived
          data/reports

limits:
  - id: avatar-max-attachments
    section: avatar
    label: "Max. # of attachments"
    value: "`38` combined [HUD](https://wiki.secondlife.com/wiki/HUD) and body attachments."
    notes: • They can be viewed by right-clicking your avatar and choosing **Edit My Outfit**.<br />• With the formal introduction of [multiple attachments to a single point](https://wiki.secondlife.com/wiki/Multiple_attachments) in Viewer 2.4, you can attach up to 38 total objects, and they can all be attached to a single point.<br />• With the introduction of the Bento armature, there are 47 attachment points available.<br />• With the introduction of Animesh, there is a limit of 1 Animesh attachment for Basic & Plus members, 2 for Premium members, and 3 for Premium Plus members.
    related: "[`llAttachToAvatar`](/functions/llAttachToAvatar/), [Animesh](/features/animesh/)"
    apis:
      - llAttachToAvatar
    features:
      - animesh
  - id: avatar-max-attachment-position
    section: avatar
    label: Max. attachment position
    value: 3.5m in a sphere around `<0, 0, 0>`.
  - id: avatar-max-clothing-layers
    section: avatar
    label: "Max. # of clothing layers"
    value: "`60` including alpha, tattoo, shoe base, physics, socks, gloves, undershirt, underpants, shirt, pants, jacket, skirt"
    notes: • On viewers before Second Life Release 3.7.29.301305, the potential total was still 60, but limited to 5 items of each type.<br />• In any case, only one each of shape, skin, eyes and hair base may be worn. These 4 basic body parts are in addition to the 60 clothing layers.
  - id: avatar-max-clothing-texture
    section: avatar
    label: Max Clothing Texture
    value: 1024x1024 px (except 128x128 px for eyes) - Server Side Appearance (and legacy baking on outside grids) will downsize larger textures\*. (Support for 2K textures & Bakes on Mesh is in development but not yet supported)
  - id: avatar-max-unassisted-fly-height
    section: avatar
    label: Max. unassisted fly height
    value: Stable hover at current ground elevation *plus* 5020m.
    notes: • You can easily acquire a flight attachment to fly high. Also see [flight limit](https://wiki.secondlife.com/wiki/Flight_limit) and [the Navigation section](#navigation) below.
  - id: avatar-common-shoe-sizes
    section: avatar
    label: Common shoe sizes
    value: Traditionally, most women's shoes were designed for a size `0` (zero) foot. Men's generally scale up to `14`. Newer items (mesh and some sculpted) replace the system feet or conform to the avatar's shape, so adjustments may be necessary.
    notes: • You can check this by going to Edit menu > Appearance and clicking on the Shape > Legs tab.
  - id: avatar-max-length-name
    section: avatar
    label: Max. length of avatar name
    value: 31 for first name, 31 for last name, 63 in total (including the space).
  - id: avatar-max-length-username
    section: avatar
    label: Max. length of [Username](https://wiki.secondlife.com/wiki/Category:LSL_Username)
    value: All lower case and a maximum of `63` including the '.'(eg; firstname.lastname)
    notes: • Older account user names are a combination of the First and last name in lower case separated by a period(.)(eg; lilmix.pixelmaid)<br />• Modern user names are a single name(no period)(eg; john1234) - **Max.** length is 31 characters<br />• The [Legacy Name](https://wiki.secondlife.com/wiki/Category:LSL_Legacy_Name)s for modern user names always shows Resident as the last name. So the Max is 40 characters in total for a new avatar's legacy name(including the space and last name 'Resident')
    related: "[`llGetUsername`](/functions/llGetUsername/)"
    apis:
      - llGetUsername
  - id: avatar-min-length-display-names
    section: avatar
    label: Min. length of [Display Names](https://wiki.secondlife.com/wiki/Display_Names)
    value: At least one script character
    related: "[`llGetDisplayName`](/functions/llGetDisplayName/)"
    apis:
      - llGetDisplayName
  - id: avatar-max-length-display-names
    section: avatar
    label: Max. length of Display Names
    value: "`31` characters"
    notes: • Display Names can include most Unicode script characters, spaces, and some punctuation.
    related: "[`llGetDisplayName`](/functions/llGetDisplayName/)"
    apis:
      - llGetDisplayName
  - id: avatar-max-speed
    section: avatar
    label: Max. avatar speed
    value: 250m/s (with only attachments to assist)
  - id: avatar-max-teleport-speed
    section: avatar
    label: Max. teleport speed
    value: 6 teleports per minute
  - id: animation-length
    section: animation
    label: Length of animation
    lower: n/a
    upper: "`60.0` seconds"
    notes: Limited by length or Size, whichever is reached first
    related: n/a
  - id: animation-size
    section: animation
    label: Size of Animation
    lower: n/a
    upper: <abbr title="250 KB (decimal), 244 KB (binary)">`250,000` bytes</abbr>
    notes: Limited by length or Size, whichever is reached first. Size is after conversion to [.anim](https://wiki.secondlife.com/wiki/Internal_Animation_Format). (See the tip for Blender users below this table.)
    related: "[Internal Animation Format](https://wiki.secondlife.com/wiki/Internal_Animation_Format)"
  - id: animation-distance-travel
    section: animation
    label: Distance an Animation Can Travel
    lower: "`-5` meters (per axis)"
    upper: +`5` meters (per axis)
    notes: 10 meters per axis cumulatively (travelling from -5 to +5).
    related: n/a
  - id: animation-priority
    section: animation
    label: animation priority
    lower: "`0`"
    upper: ".bvh: `4`, [.anim](https://wiki.secondlife.com/wiki/Internal_Animation_Format): `6`"
    notes: "[.anim](https://wiki.secondlife.com/wiki/Internal_Animation_Format) uses per-joint priorities, meaning it's possible to have a mix of joint priorities in the same animation."
    related: "[Animation Priority](https://wiki.secondlife.com/wiki/Animation_Priority)"
  - id: animation-count-unique-joints-per-animation
    section: animation
    label: Number of unique joints per animation
    lower: n/a
    upper: "`216`"
    notes: "[.anim](https://wiki.secondlife.com/wiki/Internal_Animation_Format), unlike .bvh, uses a flat structure, meaning that only the bones animated are stored, and bones which would otherwise be kept by .bvh (to keep hierarchy structure) are deleted."
    related: n/a
  - id: animation-count-simultaneous-animations-playing
    section: animation
    label: Number of simultaneous animations playing
    lower: n/a
    upper: "`30`"
    notes: n/a
    related: "[`llGetAnimationList`](/functions/llGetAnimationList/)"
    apis:
      - llGetAnimationList
  - id: building-prim-dimensions
    section: building
    label: "[Prim](https://wiki.secondlife.com/wiki/Prim) dimensions"
    lower: "`<0.01, 0.01, 0.01>`"
    upper: "`<64.0, 64.0, 64.0>`"
    notes: Used to be `<10.0, 10.0, 10.0>` prior to Second Life Server version 11.08.17.238770
    related: "[`llSetScale`](/functions/llSetScale/), [`PRIM_SIZE`](/constants/PRIM_SIZE/) and [Megaprim](https://wiki.secondlife.com/wiki/Megaprim)"
    apis:
      - llSetScale
      - PRIM_SIZE
  - id: building-count-prims-linkset
    section: building
    label: Number of prims in a linkset
    lower: n/a
    upper: "`256` prims"
    notes: Used to be 255 prior to Second Life Server version 1.26
    related: "[`llGetNumberOfPrims`](/functions/llGetNumberOfPrims/), [Linksets](/features/linkset/)"
    apis:
      - llGetNumberOfPrims
    features:
      - linkset
  - id: building-linking-distance
    section: building
    label: Linking distance
    lower: n/a
    upper: "`64` meters"
    notes: distance has changed on [2023.06 update](https://community.secondlife.com/blogs/entry/13626-coming-soon-server-release-202306/). The old max distance was 54 meters.
    related: "[`llCreateLink`](/functions/llCreateLink/)"
    apis:
      - llCreateLink
  - id: building-local-offset-avatars
    section: building
    label: Local offset (avatars)
    lower: n/a
    upper: "`1000` meters per axis"
    notes: Unlike regular [Linkability Rules](https://wiki.secondlife.com/wiki/Linkability_Rules) for linksets, an avatar sitting on an object may be moved significantly further by scripts.
    related: "`llSetLinkPrimitiveParams` with [`PRIM_POS_LOCAL`](/constants/PRIM_POS_LOCAL/)"
    apis:
      - PRIM_POS_LOCAL
  - id: building-physics-cost-physical-object
    section: building
    label: "[Physics cost](https://wiki.secondlife.com/wiki/Mesh/Mesh_physics#Physics_Resource_Cost) for a physical object"
    lower: n/a
    upper: "`32.0`"
    notes: Additional notes:<br />• If you try to link more, it'll either say "Can't enable physics for objects with more than 32 primitives" or "Object has too many primitives -- its dynamics have been disabled.".<br />• On server versions 1.38 and below, each sitting avatar counted as 1 prim. From 1.40.2 the limit is only on actual prims.
    related: "[`OBJECT_PHYSICS_COST`](/constants/OBJECT_PHYSICS_COST/)"
    apis:
      - OBJECT_PHYSICS_COST
  - id: building-build-rez-height
    section: building
    label: Build or rez height
    lower: n/a
    upper: "`4096.0` meters"
    notes: 768.0 meters for Viewers prior to version 1.20
    related: n/a
  - id: building-prim-name-length
    section: building
    label: Prim name length
    lower: n/a
    upper: "`63` bytes UTF-8 [string](/fundamentals/types/string/)"
    notes: same limit for [avatar names](https://wiki.secondlife.com/wiki/Category:LSL_Avatar/Name), although the character set for avatar names is significantly limited.
    related: "[`llSetObjectName`](/functions/llSetObjectName/)"
    apis:
      - llSetObjectName
  - id: building-prim-description-length
    section: building
    label: Prim description length
    lower: n/a
    upper: "`127` bytes UTF-8 [string](/fundamentals/types/string/)"
    notes: n/a
    related: "[`llSetObjectDesc`](/functions/llSetObjectDesc/)"
    apis:
      - llSetObjectDesc
  - id: building-temporary-prims-lifetime
    section: building
    label: Temporary prims' lifetime
    lower: n/a
    upper: up to around `60` seconds
    notes: depends upon when the next garbage collector cycle is
    related: "[`PRIM_TEMP_ON_REZ`](/constants/PRIM_TEMP_ON_REZ/)"
    apis:
      - PRIM_TEMP_ON_REZ
  - id: building-count-temporary-prims
    section: building
    label: Number of temporary prims
    lower: n/a
    upper: "`RegionPrimLimit - NumberOfPrimsInRegion + Minimum(0.5*RegionPrimLimit, 1000)`"
    notes: n/a
    related: n/a
  - id: building-length-hovertext
    section: building
    label: Length of hovertext
    lower: n/a
    upper: "`254` bytes UTF-8 [string](/fundamentals/types/string/)"
    notes: n/a
    related: "[`llSetText`](/functions/llSetText/) and [`PRIM_TEXT`](/constants/PRIM_TEXT/)"
    apis:
      - llSetText
      - PRIM_TEXT
  - id: lighting-count-active-light-sources
    section: lighting
    label: Number of active light sources
    lower: n/a
    upper: no limit
    notes: Advanced Lighting Model (ALM) was developed around 2011-2013 to remove the hard limit on light sources.
    related: "[`PRIM_POINT_LIGHT`](/constants/PRIM_POINT_LIGHT/)"
    apis:
      - PRIM_POINT_LIGHT
  - id: lighting-count-projectors-rendered-full-detail
    section: lighting
    label: Number of projectors rendered at full detail
    lower: n/a
    upper: "`2`"
    notes: Only the 2 projectors closest to an object will cause it to cast shadows. Additional projectors still affect color.
    related: "[Knowledge Base > Lighting > Projectors](https://community.secondlife.com/knowledgebase/english/lighting-and-shadows-r331/#Projectors), [`PRIM_PROJECTOR`](/constants/PRIM_PROJECTOR/)"
    apis:
      - PRIM_PROJECTOR
  - id: lighting-count-lights-rendered-alpha-blended
    section: lighting
    label: Number of lights rendered on Alpha Blended surfaces
    lower: n/a
    upper: "`8`"
    notes: 8 including the Sun and Moon. The viewer will attempt to select the "most significant" lights to render, however these blended surfaces will look different as a result of these lighting limitations.
    related: "[Alpha Blending](https://wiki.secondlife.com/wiki/Alpha_Modes_Do%27s_and_Don%27ts#Alpha_blending)"
  - id: communication-whisper-distance
    section: communication
    label: Whisper distance
    lower: n/a
    upper: "`10` meters"
    notes: "`/whisper` as the first few characters in a message can be used in viewer-2-code based viewers in local chat."
    related: "[`llWhisper`](/functions/llWhisper/)"
    apis:
      - llWhisper
  - id: communication-chat-distance
    section: communication
    label: Chat distance
    lower: n/a
    upper: "`20` meters"
    notes: text spoken as a "chat" step **within gestures** cannot be shouted or whispered. /whisper and /shout *can* be used in the "Replace with" field.
    related: "[`llSay`](/functions/llSay/)"
    apis:
      - llSay
  - id: communication-shout-distance
    section: communication
    label: Shout distance
    lower: n/a
    upper: "`100` meters"
    notes: "`/shout` as the first few characters in a message can be used in viewer-2-code based viewers in local chat."
    related: "[`llShout`](/functions/llShout/)"
    apis:
      - llShout
  - id: communication-length-chat-message-truncated
    section: communication
    label: Length of a chat message and whether or not it is truncated
    lower: "`1` byte or single-byte character"
    upper: "`1024` bytes or single-byte characters"
    notes: Limit does not apply to instant messages via [`llInstantMessage`](/functions/llInstantMessage/) and communication between IM and email, the limit there is 1023 bytes or single-byte characters.<br />The viewer-to-server communication on *negative* channels is truncated to 254 bytes, and on *positive* channels, to 1023 bytes. These limits do not affect communication between scripts.
    related: "[`llInstantMessage`](/functions/llInstantMessage/), [`llSay`](/functions/llSay/)"
    apis:
      - llInstantMessage
      - llSay
  - id: communication-max-events
    section: communication
    label: Maximum events
    lower: n/a
    upper: "`64` events"
    notes: Events are stored in a 64 bit bitmap. Events happening when the bitmap is full, will get discarded.
    related: n/a
  - id: communication-count-offline-messages
    section: communication
    label: Number of offline messages
    lower: n/a
    upper: Capped at `30` messages for Basic members, `40` for Plus members, `120` for Premium members, and `240` for Premium Plus members.
    notes: "Number of offline messages (involving [IMs](https://wiki.secondlife.com/wiki/IM), inventory offers, group notices, group invitations) received before messages get capped. Note: If autoAcceptNewInventory (debug setting) is set to TRUE (the default is FALSE), then all inventory offers, even above the cap allowed by membership, go directly to inventory and do not count against the cap on offline messages."
    related: "[IM](https://wiki.secondlife.com/wiki/IM) - [Blog Post](https://community.secondlife.com/blogs/entry/2559-group-limits-update-no-changes-for-basic-members/)"
  - id: communication-length-properly-delivered-email-reply
    section: communication
    label: Length of a properly delivered email reply to an [IM](https://wiki.secondlife.com/wiki/IM)
    lower: n/a
    upper: "`1023` bytes or single-byte characters"
    notes: n/a
    related: n/a
  - id: communication-time-reply-im-sent-via
    section: communication
    label: Time after which a reply to an [IM](https://wiki.secondlife.com/wiki/IM) can be sent via email.
    lower: when receiving the IM via email.
    upper: "`5` days after receiving the offline IM via email."
    notes: n/a
    related: "[Second Life Blogs](https://blogs.secondlife.com/community/features/blog/2007/02/06/im-to-e-mail-return-addresses-changing)"
  - id: communication-time-period-ims-stored-second
    section: communication
    label: Time period for which [IMs](https://wiki.secondlife.com/wiki/IM) are stored within Second Life.
    lower: n/a
    upper: "`31` days after receiving the [IM](https://wiki.secondlife.com/wiki/IM)"
    notes: "[Torley Linden](https://wiki.secondlife.com/wiki/User:Torley_Linden) confirmed this with [Kelly Linden](https://wiki.secondlife.com/wiki/User:Kelly_Linden)"
    related: n/a
  - id: communication-count-ims-sent-object-hour
    section: communication
    label: Number of [IMs](https://wiki.secondlife.com/wiki/IM) sent by an object within an hour
    lower: n/a
    upper: "`5000` per hour"
    notes: n/a
    related: "[`llInstantMessage`](/functions/llInstantMessage/)"
    apis:
      - llInstantMessage
  - id: gestures-shortcut-key-mappings
    section: gestures
    label: Shortcut key mappings
    lower: n/a
    upper: "`33` unique combinations, since <kbd>F2</kbd>–<kbd>F12</kbd> can be used with the <kbd>Ctrl</kbd> or <kbd>Shift</kbd> modifiers."
    notes: n/a
    related: "[All_keyboard_shortcut_keys](https://wiki.secondlife.com/wiki/All_keyboard_shortcut_keys) and [the knowledge base](http://community.secondlife.com/t5/English-Knowledge-Base/Keyboard-shortcuts/ta-p/1086557)"
  - id: gestures-chat-step-length
    section: gestures
    label: Chat step length
    lower: n/a
    upper: "`127` bytes or single-byte characters"
    notes: n/a
    related: n/a
  - id: gestures-wait-time
    section: gestures
    label: Wait time
    lower: n/a
    upper: "`3600` seconds (which is one hour)"
    notes: n/a
    related: n/a
  - id: gestures-max-steps-data
    section: gestures
    label: Maximum steps data
    lower: n/a
    upper: '`1000` bytes of packed data; saving with more data returns the message "Gesture save failed. This gesture has too many steps. Try removing some steps, then save again." Shorter text, for example, will allow more steps.'
    notes: n/a
    related: n/a
  - id: gestures-length-included-assets
    section: gestures
    label: Length of included assets
    lower: n/a
    upper: see sections for [animation](#animation), [sound](#sound)
    notes: n/a
    related: n/a
  - id: groups-max-count-belong
    section: groups
    label: Maximum number of groups you can belong to
    value: "`50` for Basic members, `55` for Plus members, `80` for Premium members, `150` for Premium Plus members."
    notes: • After downgrading from a higher limit membership to a lower one, you may not join any new groups until you are a member of fewer than your current subscription's group limit. For example, if you downgrade from Premium (80 groups allowed) to Basic (50 groups allowed), you can't join any new groups until you're a member of fewer than 50 groups.<br />• Roles within groups are sort of like sub-groups. In many cases, you can use them instead of creating new groups.
  - id: groups-min-count-members-group
    section: groups
    label: Minimum number of members in a group
    value: "`2`"
    notes: • A group with only 1 person for 48 hours will be disbanded (cancelled), unless the group owns land.
  - id: groups-max-count-roles-allowed-group
    section: groups
    label: Maximum number of roles allowed in a group
    value: 10 (including "Owners" and "Everyone", which cannot be deleted)
  - id: groups-max-name
    section: groups
    label: Maximum Group Name
    value: 35 single-byte characters.
  - id: groups-max-description-length
    section: groups
    label: Maximum Group Description Length
    value: 511 single-byte characters.
  - id: groups-max-title
    section: groups
    label: Maximum Group Title
    value: 20 single-byte characters.
  - id: groups-max-length-notice
    section: groups
    label: Maximum Length of a Group Notice
    value: 512 single-byte characters.
  - id: groups-max-age-notice
    section: groups
    label: Maximum Age of a Group Notice
    value: 14 days.
  - id: inventory-max-count-items-sent-folder
    section: inventory
    label: Maximum number of inventory items that can be sent in a folder
    value: "`42`"
    notes: • Folders count as items too. This has more to do with packet size limits than cheeky Douglas Adams references.
    related: "[`llGiveInventoryList`](/functions/llGiveInventoryList/)"
    apis:
      - llGiveInventoryList
  - id: inventory-max-count-accounts-item-shared
    section: inventory
    label: Maximum number of accounts that an inventory item can be shared with at once
    value: The limit is unknown, but tests show that it is more than 35. No documentation has been found. One third-party viewer developer says that the code doesn't seem to look for a limit. It just builds the list and sends it to each avatar individually.
  - id: inventory-max-count-items-contained-prim
    section: inventory
    label: Maximum number of inventory items that can be contained in a prim
    value: 10,000
    related: "[`llGetInventoryNumber`](/functions/llGetInventoryNumber/), [Inventory](/features/inventory/)"
    apis:
      - llGetInventoryNumber
    features:
      - inventory
  - id: inventory-max-chars-item-name-including
    section: inventory
    label: Maximum characters in an inventory item name (including folder names)
    value: "63"
    related: "[`llGetInventoryName`](/functions/llGetInventoryName/)"
    apis:
      - llGetInventoryName
  - id: inventory-max-notecard-line
    section: inventory
    label: Maximum notecard line
    value: None, but scripts can only read the first 1024 bytes (was 255 bytes before server version [2021-10-25.565008](https://releasenotes.secondlife.com/simulator/2021-10-25.565008.html)).
    related: "[`llGetNotecardLine`](/functions/llGetNotecardLine/), [`llGetNotecardLineSync`](/functions/llGetNotecardLineSync/)"
    apis:
      - llGetNotecardLine
      - llGetNotecardLineSync
  - id: inventory-max-notecard-size
    section: inventory
    label: Maximum notecard size
    value: 65,536 bytes
  - id: inventory-max-uncompiled-script-size
    section: inventory
    label: Maximum uncompiled script size
    value: 262,144 bytes
  - id: inventory-count-items-library
    section: inventory
    label: Number of items in the Library
    value: "`3,500` as of `2019`-08-10"
    notes: • Verified by [hiding the Library](https://wiki.secondlife.com/wiki/How_does_the_Library_work) and counting the difference.
  - id: inventory-max-count-items-displayed-single
    section: inventory
    label: Maximum number of inventory items displayed in a single inventory folder
    value: Several thousand.
    notes: • This was discussed during [Simulator User Group transcript, 2011.03.08](http://wiki.secondlife.com/wiki/Simulator_User_Group/Transcripts/2011.03.08) "the folder will load up to the limit number of items, and remaining ones won't show up in the viewer. you still own them, they aren't lost, but they will be hidden until the folder size is reduced."<br />• There is no specified limit for total avatar inventory, very large folders can be split.<br />• There was discussion in the Third Party Developers' UG (4/10/2015) meeting about new inventory and login problems from having large numbers of items in a single folder. AISv3 *removed* server-side limits on the number of items in a folder. Flat inventories are bad. No one is certain at what number of items in a folder cause a login problem. The fix is to clear the inventory cache (not the viewer cache) and log into a deserted, empty region then move inventory items into folders and sub-folders. - The problem appears at different a number of items depending on your computer and connection speed. Hopefully being on an empty region will give one enough edge to get logged in and do some corrective work before being dropped. If not, you will need to contact support for help. They will divide large folders into smaller groups so you can log in.
  - id: land-max-parcel-size
    section: land
    label: Maximum [parcel](https://wiki.secondlife.com/wiki/Land#Parcel) size
    value: "`65,536` meters²"
    notes: • Covering a whole region, or square on the World Map.
  - id: land-min-parcel-size
    section: land
    label: Minimum parcel size
    value: 16 meters²
  - id: land-max-parcel-name-length
    section: land
    label: Maximum parcel name length
    value: 63 single-byte characters

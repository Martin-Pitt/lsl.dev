    related: n/a
  - id: textures-max-size
    section: textures
    label: Maximum texture size
    value: "`2048` × `2048` pixels"
    notes: • All Second Life textures are constrained to [powers of 2](http://en.wikipedia.org/wiki/Power_of_2) (e.g., 128, 256, 512).<br />• We strongly recommend you use as small textures as possible because larger ones consume more memory and take substantially longer to load.<br />• Where large textures are being forced by import to only 512×512, lower your ...> Preferences >...> UI Size under 1.0, to increase import size to the max 2048×2048.
  - id: textures-min-size
    section: textures
    label: Minimum texture size
    value: "`4` × `4` pixels"
    notes: "• This means that there are ten possible image dimensions: 4, 8, 16, 32, 64, 128, 256, 512, 1024 & 2048 pixels, either horizontal or vertical."
  - id: textures-resizing
    section: textures
    label: Texture resizing
    notes: "• Uploaded textures will be resized to the dimensions above.<br />• Each dimension is resized independently (for instance, a 1024 x 999 image will be resized to 1024 x 1024).<br />• A dimension that is already a power of two will not be resized.<br />• The uploader “prefers” to round down rather than up. The threshold for rounding down/up is .75 of the distance between powers of two.<br />&nbsp;&nbsp;◦ For example, given a dimension of x, if x / 512 is larger than 1.75, x will be resized to 1024, else 512.<br />&nbsp;&nbsp;◦ Another example: If x / 256 is larger than 1.75, x will be resized to 512."

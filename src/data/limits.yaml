# Second Life's numerical limits, one entry per row of the tables on /reference/limits/.
# Extracted from src/content/docs/reference/limits.mdx (adapted from the Second Life Wiki "Limits"
# page, CC BY-SA 3.0); figures and notes are kept exactly as written there.
#
# Rendered by <LimitsTable section="…" /> and <Limit id="…" /> (src/components/authoring/asides/).
# Every text field is Markdown, rendered with the site's Markdown pipeline. Fields:
#   sections[]: id, heading (the page heading it sits under), columns (field: header text, in display order)
#   limits[]:   id (the row's anchor: /reference/limits/#<id>), section, label,
#               value (sections with one "Value" column) or lower / upper (range sections),
#               notes, related (the "More coverage" cell), apis and features (taken from related).
# An empty cell is an absent field. Ids are stable: authors link to them, so don't rename one.

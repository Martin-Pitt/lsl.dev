    lower: n/a
    upper: less than `30` seconds or precisely `1,323,000` samples
    notes: The advice is typically to upload sounds less than 30.0 and that 29.99 seconds is fine. However if you do wish to be able upload sounds that are 30 seconds precisely then the .WAV file must have exactly 1,323,000 samples (44,100Hz \* 30 seconds). Specifically anything above 1,323,000 samples fails to upload.
    related: "**[Uploading Assets](https://community.secondlife.com/knowledgebase/english/uploading-assets-r75/)**, [Sound](/features/sound/)"
    features:
      - sound

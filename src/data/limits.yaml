    value: Generally, FPS equal to or above `24` is good. The higher it gets, the smoother**\***. You can check via [Advanced](https://wiki.secondlife.com/wiki/Advanced) menu > Performance Tools > Lag Meter, or for more advanced usage, see Advanced > Performance Tools > Statistics Bar.

      - llGetParcelDetails
      - PARCEL_DETAILS_DESC
  - id: land-region-name-length
    section: land
    label: Region name length
    value: Linden Concierge policy states a minimum of 3 characters, and a maximum of 25 characters (including spaces). See [Guidelines for Private Region Naming](https://wiki.secondlife.com/wiki/Linden_Lab_Official:Guidelines_for_Private_Region_Naming). However, the technical maximum limit is 35 characters, and exceptions to the concierge policy do exist (e.g [Sandbox - Weapons testing (no damag](http://maps.secondlife.com/secondlife/Sandbox%20-%20Weapons%20testing%20%28no%20damag/128/128/2) and [X](http://slurl.com/secondlife/X/128/128/24))
    related: "[`llGetRegionName`](/functions/llGetRegionName/)"
    apis:
      - llGetRegionName
  - id: land-ban-line-height-no-entry
    section: land
    label: Ban line height for "no entry" or "pay to access"
    value: (in other words, "allow public access" is turned off, or "allow group access" is turned on, in the parcel options) is the parcel's ground elevation *plus* 50 meters (except, if the region has been set to "Block Parcel Fly Over" in which case the access controls extend to at least 4096 meters). If a user is **explicitly banned by name**, the height is the parcel's ground elevation *plus* 5000 meters. On current viewers this is visible to the full extent.
    related: "[`llAddToLandBanList`](/functions/llAddToLandBanList/)"
    apis:
      - llAddToLandBanList
  - id: land-max-prims-region
    section: land
    label: Maximum prims in a [region](https://wiki.secondlife.com/wiki/Land#Region)
    value: '• "Mainland / Full Region" and "Linden Homes / Full Region": `22,500`<br />• Full Regions in private estates: `20,000` with an [option for 30,000](https://community.secondlife.com/t5/Featured-News/Upgrade-Your-Full-Private-Region-to-30-000-Land-Impact-Today/ba-p/3086162)<br />• Homestead: `5,000`<br />• Openspace : `1,000`'
    notes: To check a region's capacity, use `llGetEnv("region_max_prims")`.<br />*(Region types are as found in the General tab of World > About Land, or returned by `llGetEnv("region_product_name")`)*
    related: "[`llGetEnv`](/functions/llGetEnv/)"
    apis:
      - llGetEnv
  - id: land-max-auto-return-value
    section: land
    label: Maximum auto return value
    value: Besides `0` (which means *never*), <abbr title="Almost 23 months">999,999</abbr> minutes is the highest auto return value.
  - id: land-terraforming-limits
    section: land
    label: Terraforming limits
    value: "• Most mainland can be raised/lowered by 4 meters (+/-).<br />• Some mainland regions cannot be terraformed, including: Bay City regions, Boardman, Brown, De Haro, Horizons, Kama City regions, Nautilus City regions, Nova Albion regions, and Shermerville regions.<br />• [Linden Homes](http://community.secondlife.com/t5/English-Knowledge-Base/Linden-Homes/ta-p/700103) do not allow terraforming.<br />• A few, very old mainland Regions like Da Boom have a terraform range of 40 meters (+/-).<br />• Estate (private island) terraformability is settable to a maximum of 100 meters (+/-) by the estate owner or managers."
  - id: land-max-water-height
    section: land
    label: Maximum water height
    value: "`100` meters using inworld controls, `255` meters by using a `*.raw` file upload."
    notes: • Region water height is usually 20 meters, and adjacent regions should have the same water height, or else they will look discontinuous.
  - id: land-max-terrain-height
    section: land
    label: Maximum terrain height
    value: 255 meters using inworld controls (Region/Estate setting & Edit Terrain tool), 510 meters by using a `*.raw` file upload.
  - id: land-miscellaneous-estate-limits
    section: land
    label: Miscellaneous estate limits
    value: You can have a maximum of `20` estate managers, `500` allowed Residents, `63` allowed groups, and `750` banned Residents.
    notes: • See World menu > Region/Estate > Estate tab.
  - id: land-max-count-agents
    section: land
    label: Maximum number of agents
    value: "• [Event Regions](https://second.life/eventregions): 175 agents<br />• Full region: 100 basic account users plus 10 additional available to premium accounts. (Typically set to 40 on mainland, 55 on Linden Homes regions, but this does vary. Some meeting areas have this set to 60 and higher.)<br />&nbsp;&nbsp;◦ Recent server performance improvements make regions with 60 agents in them perform quite well.<br />• [Homestead](https://wiki.secondlife.com/wiki/Land#Homestead): 20 (plus 5 additional available to premium accounts)<br />• [Openspace](https://wiki.secondlife.com/wiki/Land#Openspace): 10 (plus 2 additional available to premium accounts)"
    related: "[`llGetRegionAgentCount`](/functions/llGetRegionAgentCount/)"
    apis:
      - llGetRegionAgentCount
  - id: land-freeze-time
    section: land
    label: Freeze Time
    value: Land owners can [freeze](https://wiki.secondlife.com/wiki/Freeze) other Residents for up to 30 seconds. Members of land-owning groups can also be granted this ability.

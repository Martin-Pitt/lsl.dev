<div class="wiki-line">Here's a function to turn an UUID into an integer.</div>
<div class="wiki-line"><pre><code>integer Key2Integer(string inkey)
{
    return (integer)(&quot;0x&quot; + llGetSubString(llMD5String(inkey,0), 0, 7));   
}</code></pre></div>
<div class="wiki-line">Note: The <a href="https://wiki.secondlife.com/wiki/Seedable_PRNG">Seedable_PRNG</a> example presents MD5 of MD5 of MD5 of ... as pseudo-random numbers</div>

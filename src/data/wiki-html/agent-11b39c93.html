<div class="wiki-line">The data representation of the current user.</div>
<div class="wiki-line">In general, the code uses "agent" to mean you and "<a href="/wiki/avatar-ca8e826d/">avatar</a>" to mean someone else. Identified by a <a href="https://wiki.secondlife.com/wiki/UUID">UUID</a>, usually called <code>agent_id</code> in the code.</div>

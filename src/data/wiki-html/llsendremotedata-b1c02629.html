<section><h2 id="wiki-description">Wiki description</h2><div class="wiki-line">Send an XML-RPC request to <code>dest</code> through channel with payload of <code>channel</code> (in a string), integer <code>idata</code> and string <code>sdata</code>.</div></section>
<section><h2 id="return-value-notes">Return value notes</h2><div class="wiki-line">Returns a <a href="https://wiki.secondlife.com/wiki/key">key</a> that is the message_id for the resulting <a href="/wiki/remote-data-3ce63638/">remote_data</a> events.</div></section>

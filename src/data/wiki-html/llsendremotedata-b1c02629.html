<section><h2 id="wiki-description">Wiki description</h2><div class="wiki-line">Send an XML-RPC request to <span class="wiki-param"><code>dest</code></span> through channel with payload of <span class="wiki-param"><code>channel</code></span> (in a string), integer <span class="wiki-param"><code>idata</code></span> and string <span class="wiki-param"><code>sdata</code></span>.</div></section>
<section><h2 id="return-value-notes">Return value notes</h2><div class="wiki-line">Returns a <a href="https://wiki.secondlife.com/wiki/key">key</a> that is the message_id for the resulting <a href="/wiki/remote-data-3ce63638/">remote_data</a> events.</div></section>

<section><h2 id="wiki-description">Wiki description</h2><div class="wiki-line">Used with <a href="/constants/PRIM_ALPHA_MODE/">PRIM_ALPHA_MODE</a>. Prims faces set to this type render as either completely opaque or completely transparent on a per-pixel basis.  Pixels which are less opaque than the specified <code>mask_cutoff</code> are rendered as completely transparent, and the rest are rendered as fully opaque.</div></section>

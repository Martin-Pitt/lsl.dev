<section><h2 id="wiki-description">Wiki description</h2><div class="wiki-line">Used with <a href="/constants/PRIM_REFLECTION_PROBE/">PRIM_REFLECTION_PROBE</a>. A reflection probe does not image avatars by default, otherwise it images avatars if this flag is set on the corresponding prim. Imaging avatars in reflection probes has a performance cost.</div></section>

<section><h2 id="wiki-description">Wiki description</h2><div class="wiki-line">Used with <a href="/constants/PRIM_REFLECTION_PROBE/">PRIM_REFLECTION_PROBE</a>. When enabled, objects with low-roughness PBR materials objects act as a mirror. Note that mirrors do not reflect avatars unless <a href="/constants/PRIM_REFLECTION_PROBE_DYNAMIC/">PRIM_REFLECTION_PROBE_DYNAMIC</a> is also set. Rendering mirrors has a performance cost.</div></section>
